<!-- src/pages/database.html -->
<div class="db-page">

    <!-- HEADER -->
    <div class="db-header">
        <div class="db-header-left">
            <h1 class="db-title">🗄️ Banco de Dados</h1>
            <p class="db-subtitle">Gestão completa dos dados do jogo</p>
        </div>
        <div class="db-header-actions">
            <span id="db-record-count" class="db-badge">0 registros</span>
            <button class="db-refresh-btn" onclick="renderCrudTable()">↺ Atualizar</button>
        </div>
    </div>

    <!-- TABS DE CATEGORIA -->
    <div class="db-category-tabs">
        <button class="db-cat-tab active" onclick="selectDbCategory('characters', this)" data-icon="👤">
            <span class="dbt-icon">👤</span>
            <span class="dbt-label">Personagens</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('equipments', this)" data-icon="⚔️">
            <span class="dbt-icon">⚔️</span>
            <span class="dbt-label">Equipamentos</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('consumables', this)" data-icon="🧪">
            <span class="dbt-icon">🧪</span>
            <span class="dbt-label">Consumíveis</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('bodies', this)" data-icon="🧍">
            <span class="dbt-icon">🧍</span>
            <span class="dbt-label">Corpos</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('attacks', this)" data-icon="💥">
            <span class="dbt-icon">💥</span>
            <span class="dbt-label">Habilidades</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('guilds', this)" data-icon="🏰">
            <span class="dbt-icon">🏰</span>
            <span class="dbt-label">Guildas</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('guild_quests', this)" data-icon="📜">
            <span class="dbt-icon">📜</span>
            <span class="dbt-label">Quests</span>
        </button>
        <button class="db-cat-tab" onclick="selectDbCategory('guild_members', this)" data-icon="🤝">
            <span class="dbt-icon">🤝</span>
            <span class="dbt-label">Membros</span>
        </button>
    </div>

    <!-- SEARCH BAR -->
    <div class="db-search-bar">
        <input type="text" id="db-search-input" placeholder="🔍 Buscar nesta tabela..." oninput="filterDbTable()" />
        <span id="db-filtered-count" class="db-filter-info"></span>
    </div>

    <!-- TABLE AREA -->
    <div class="db-table-wrapper">
        <table class="db-table" id="db-main-table">
            <thead><tr id="crud-thead"></tr></thead>
            <tbody id="crud-tbody"></tbody>
        </table>
        <div id="db-empty-state" class="db-empty" style="display:none;">
            <span class="db-empty-icon">📭</span>
            <p>Nenhum registro encontrado</p>
        </div>
    </div>
</div>
