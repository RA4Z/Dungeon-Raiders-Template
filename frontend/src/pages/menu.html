<div class="main-menu-bg">
    <h1 class="main-title">RPG Clicker</h1>
    <button class="btn-new-game" onclick="openNewGameModal()">+ Iniciar Novo Jogo</button>

    <h2 style="color:#f39c12; margin: 30px 0 10px 0; text-shadow:1px 1px 2px #000;">Saves Disponíveis:</h2>
    <div id="saves-list-container" class="saves-grid"></div>
</div>

<div id="new-game-modal" class="modal-overlay" style="display:none;">
    <div class="loot-box"
        style="display:flex; max-width:900px; width:95%; padding:0; overflow:hidden; text-align:left;">

        <!-- LADO ESQUERDO: OPÇÕES -->
        <div style="flex:1; padding:30px; background:#2c3e50; overflow-y:auto; max-height:90vh;">
            <button class="inv-close" onclick="closeNewGameModal()" style="top:10px; right:10px;">X</button>
            <h2 style="color:#f1c40f; border-bottom:1px solid #555; padding-bottom:10px;">Criar Herói</h2>

            <label style="color:#bdc3c7; font-weight:bold; margin-top:10px; display:block;">Nome:</label>
            <input type="text" id="ng-name"
                style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:none;"
                placeholder="Ex: Arthur">

            <!-- GÊNERO -->
            <label style="color:#bdc3c7; font-weight:bold; display:block; margin-bottom:8px;">Gênero:</label>
            <div id="ng-gender-select" style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="ng-btn-male" class="ng-gender-btn active" onclick="selectNewGameGender('male')">♂
                    Masculino</button>
                <button id="ng-btn-female" class="ng-gender-btn" onclick="selectNewGameGender('female')">♀
                    Feminino</button>
            </div>

            <label style="color:#bdc3c7; font-weight:bold; display:block;">Corpo Base:</label>
            <select id="ng-body" onchange="updateNewGamePreview()"
                style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px;"></select>

            <label style="color:#bdc3c7; font-weight:bold; display:block;">Rosto / Expressão:</label>
            <select id="ng-face" onchange="updateNewGamePreview()"
                style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px;"></select>

            <label style="color:#bdc3c7; font-weight:bold; display:block;">Cabelo:</label>
            <select id="ng-hair" onchange="updateNewGamePreview()"
                style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px;"></select>

            <label style="color:#bdc3c7; font-weight:bold; display:block; margin-bottom:5px;">Tom de Pele
                (Shader):</label>
            <div id="ng-colors" style="display:flex; gap:10px; margin-bottom:25px; flex-wrap:wrap;"></div>

            <label style="color:#bdc3c7; font-weight:bold; display:block; margin-top:20px;">Atributos Base (Pontos:
                <span id="ng-pts-left" style="color:#e74c3c;">10</span>)</label>
            <div id="ng-stats-grid"
                style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; background:#111; padding:15px; border-radius:5px;">
            </div>

            <label style="color:#bdc3c7; font-weight:bold; display:block; margin-top:20px; margin-bottom:5px;">🌍 Tamanho do Mundo (Gerador)</label>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <div style="flex:1;">
                    <label style="font-size:0.8em; color:#7f8c8d;">Qtd. de Guildas</label>
                    <input type="number" id="ng-gen-guilds" value="4" min="1" max="15" style="width:100%; padding:8px; border-radius:5px; border:none; background:#111; color:#fff;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:0.8em; color:#7f8c8d;">Aliados por Guilda</label>
                    <input type="number" id="ng-gen-npcs" value="8" min="3" max="30" style="width:100%; padding:8px; border-radius:5px; border:none; background:#111; color:#fff;">
                </div>
            </div>
            
            <button id="ng-btn-create" onclick="createNewGame()" style="width:100%; padding:15px; background:#2ecc71; border:none; color:#fff; font-weight:bold; font-size:1.1rem; border-radius:5px; cursor:pointer;">Entrar no Mundo!</button>
        
        </div>

        <!-- LADO DIREITO: PRÉVIA -->
        <div
            style="width:340px; background:#1a252f; padding:20px; display:flex; flex-direction:column; align-items:center; border-left:2px solid #e67e22; overflow-y:auto;">
            <h3 style="color:#ecf0f1; margin-bottom:10px;">Pré-Visualização</h3>
            <div id="ng-gender-badge" style="margin-bottom:15px; font-size:1.2rem; color:#3498db; font-weight:bold;">♂
                Masculino</div>

            <div style="display:flex; gap:20px; margin-bottom: 20px;">
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="paper-doll-container" id="ng-prev-front"
                        style="background:#111; border:1px solid #444; border-radius:5px; transform:scale(1.1); margin-bottom:10px;">
                    </div>
                    <span
                        style="color:#7f8c8d; font-size:0.9em; font-weight:bold; text-transform:uppercase;">Frente</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="paper-doll-container" id="ng-prev-back"
                        style="background:#111; border:1px solid #444; border-radius:5px; transform:scale(1.1); margin-bottom:10px;">
                    </div>
                    <span
                        style="color:#7f8c8d; font-size:0.9em; font-weight:bold; text-transform:uppercase;">Costas</span>
                </div>
            </div>

            <!-- NOVA CAIXA DE STATUS AQUI -->
            <div style="width: 100%; border-top: 1px solid #30363d; padding-top: 15px;">
                <h4 style="color:#f39c12; margin-bottom: 10px; text-align:center;">Status Iniciais</h4>
                <div id="ng-stats-preview"
                    style="display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#0d1117; padding:10px; border-radius:8px; border:1px solid #21262d;">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .ng-gender-btn {
        flex: 1;
        padding: 10px;
        background: #34495e;
        border: 2px solid #555;
        color: #bdc3c7;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        transition: 0.15s;
    }

    .ng-gender-btn.active {
        background: #2c3e50;
        border-color: #3498db;
        color: #3498db;
        box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
    }
</style>
