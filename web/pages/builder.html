<h1>Montagem de Personagem / Monstro</h1>
<div class="forms-grid" style="align-items: flex-start;">
    <div class="form-card" style="flex: 2;" id="form-char">
        <div class="attr-grid">
            <label>Nome <input type="text" id="ch-name" oninput="updateLivePreview()"></label>
            <label>Raça:
                <select id="ch-race" onchange="toggleRaceFields()">
                    <option value="humano">Humanoide (Montar por Peças)</option>
                    <option value="monstro">Monstro Único (Simples)</option>
                </select>
            </label>
        </div>

        <h4 style="margin-top:10px; color:#f39c12;">Atributos Base (Para Ambos)</h4>
        <div id="builder-base-stats" class="attr-grid" style="background:#111; padding:10px; border-radius:5px; margin-bottom:15px;"></div>

        <div id="simple-fields" style="display:none;">
            <label>Img Frente (Corpo inteiro)</label>
            <div class="file-input-group"><input type="text" id="ch-img-f" oninput="updateLivePreview()"><img id="prev-ch-f" class="mini-preview" src=""></div>
            <label>Img Verso (Costas)</label>
            <div class="file-input-group"><input type="text" id="ch-img-b" oninput="updateLivePreview()"><img id="prev-ch-b" class="mini-preview" src=""></div>
            
            <h4 style="margin-top:10px; color:#e74c3c;">Sub-Status (Overrides para Monstros)</h4>
            <p style="font-size:0.8em; color:#777; margin-bottom:5px;">Deixe em branco para usar a fórmula automática baseada nos atributos acima.</p>
            <div id="builder-sub-stats" class="attr-grid" style="background:#111; padding:10px; border-radius:5px; max-height:150px; overflow-y:auto;"></div>

            <div style="background: #222; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #444;">
                <h4 style="color: #3498db; margin-bottom: 10px;">Loot do Monstro</h4>
                <div class="attr-grid" style="align-items: end;">
                    <label>Item:<select id="cd-item"></select></label>
                    <label>Chance Drop (%):<input type="number" id="cd-chance" value="50" min="1" max="100"></label>
                </div>
                <button onclick="addCustomDrop()" style="background:#2980b9; padding:8px; margin-bottom:10px;">+ Adicionar à Lista de Loot</button>
                <ul id="cd-list" style="list-style: none; padding: 0; font-size: 0.9em;"></ul>
            </div>
        </div>

        <div id="human-fields" style="margin-top: 15px;">
            <h4 style="color:#2ecc71; margin-bottom:5px;">Equipamentos Iniciais (Inimigo Humanoide)</h4>
            <div class="attr-grid">
                <label>Corpo: <select id="sel-base" onchange="updateLivePreview()"></select></label>
                <label>Rosto: <select id="sel-face" onchange="updateLivePreview()"></select></label>
                <label>Cabelo: <select id="sel-hair" onchange="updateLivePreview()"></select></label>
                <label>Camisa: <select id="sel-shirt" onchange="updateLivePreview()"></select></label>
                <label>Calças: <select id="sel-pants" onchange="updateLivePreview()"></select></label>
                <label>Capacete: <select id="sel-helmet" onchange="updateLivePreview()"></select></label>
                <label>Luvas: <select id="sel-gloves" onchange="updateLivePreview()"></select></label>
                <label>Botas: <select id="sel-boots" onchange="updateLivePreview()"></select></label>
                <label>Mão Dir: <select id="sel-hand_r" onchange="updateLivePreview()"></select></label>
                <label>Mão Esq: <select id="sel-hand_l" onchange="updateLivePreview()"></select></label>
                <label style="grid-column: span 2;">Acessório: <select id="sel-accessory" onchange="updateLivePreview()"></select></label>
            </div>
        </div>
        <button onclick="saveCharacter()" style="margin-top:20px; font-size:1.2em;">Salvar Inimigo no Banco</button>
        <p id="char-msg" class="msg-alert"></p>
    </div>

    <!-- PAINEL DIREITO: LIVE PREVIEW -->
    <div class="form-card" style="flex: 1;" id="preview-panel">
        <h3>Pré-Visualização</h3>
        <div class="preview-boxes" style="display:flex; justify-content:space-around; background:#111; padding:20px; border-radius:5px; margin-bottom:15px;">
            <div class="paper-doll-container" id="prev-front"></div>
            <div class="paper-doll-container" id="prev-back"></div>
        </div>
        
        <h4 style="color:#3498db; border-bottom:1px solid #444; padding-bottom:5px;">Status Calculados</h4>
        <div id="live-stats-preview" style="background:#111; padding:10px; border-radius:5px; font-family:monospace; font-size:1em; color:#bdc3c7; display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <!-- Preenchido via JS -->
        </div>
    </div>
</div>
