<div class="main-menu-bg">
    <h1 class="main-title">RPG Clicker</h1>
    <button class="btn-new-game" onclick="openNewGameModal()">+ Iniciar Novo Jogo</button>
    
    <h2 style="color:#f39c12; margin: 30px 0 10px 0; text-shadow:1px 1px 2px #000;">Saves Disponíveis:</h2>
    <div id="saves-list-container" class="saves-grid"></div>
</div>

<div id="new-game-modal" class="modal-overlay" style="display:none;">
    <div class="loot-box">
        <button class="inv-close" onclick="closeNewGameModal()">X</button>
        <h2>Novo Personagem</h2>
        <label style="color:#fff; text-align:left; display:block; margin-bottom:5px;">Nome do Personagem:</label>
        <input type="text" id="ng-name" style="width:100%; padding:10px; margin-bottom:15px;" placeholder="Ex: Arthur">
        <label style="color:#fff; text-align:left; display:block; margin-bottom:5px;">Escolha seu Corpo Inicial:</label>
        <select id="ng-body" style="width:100%; padding:10px; margin-bottom:20px;"></select>
        <button onclick="createNewGame()" style="width:100%; padding:15px; background:#2ecc71; border:none; color:#fff; font-weight:bold; font-size:1.1rem; border-radius:5px; cursor:pointer;">Criar e Jogar!</button>
    </div>
</div>
